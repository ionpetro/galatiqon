# Copy to /etc/galatiqon/config.toml. Every key is optional; defaults shown.

[owner]
name = ""              # who this galatiqon belongs to, e.g. "Scott". Used for the bot name.

[grokbot]
bot = ""               # Grok Bot to talk to. Empty = "Galatiqon · <owner.name>" (what galatiqon-provision creates)
transport = "gbd"      # "gbd" (local daemon API, streams replies as they arrive) or "cli" (`gb ask`, no daemon)
gbd_socket = ""        # Unix socket of gbd; empty = ~/.config/gb/default/gbd.sock of the service user
gbd_url = ""           # or a TCP listener, e.g. "http://127.0.0.1:8787" (needs gbd_token)
gbd_token = ""
gb_binary = "gb"       # GrokBotCLI binary, used by the "cli" transport and by galatiqon-provision
reply_timeout_s = 90   # give up waiting for the bot after this
ack_after_s = 4.0      # say a short "On it." if the bot takes longer than this; 0 = off
# ack_phrases = ["On it.", "One sec.", "Checking.", "Let me look."]
# prompt_prefix = "..."  # override the instructions sent with every utterance

[listen]              # galatiqon-listen: speak what the bot writes when it wasn't the button that asked
speak_device_turns = false   # push-to-talk replies are spoken by galatiqon-ptt already
say_command = ""             # empty = this device's speaker; or a command the text is appended to,
                             # e.g. "ssh pi@musebike.local sudo -n -u muse bike-say" (bridge on a laptop)
read_timeout_s = 90          # reconnect if the event stream goes quiet for this long

[button]
mode = "gpio"          # "gpio" (momentary button) or "keyboard" (press Enter to start/stop, for SSH testing)
gpio_pin = 17          # BCM pin; button between this pin and GND (physical pins 11 and 9)
min_hold_s = 0.3

[audio]
input_device = "default"   # `arecord -L` to list; e.g. "plughw:CARD=Device,DEV=0" for a USB mic
max_record_s = 20

[stt]
vosk_model = "/opt/galatiqon/models/vosk-model-small-en-us-0.15"

[tts]
engine = "piper"       # "piper" (natural), "espeak-ng" (instant, robotic) or "say" (macOS laptop demo)
piper_voice = "/opt/galatiqon/voices/en_US-lessac-low.onnx"
espeak_voice = "en-us"

[tts.pronunciations]   # respell words for the voice only; the screen shows the original
Galatiq = "Galatick"

[display]
backend = "pygame"     # "none" if no screen is attached
font_size = 28
message_timeout_s = 30
